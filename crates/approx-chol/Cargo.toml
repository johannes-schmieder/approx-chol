[package]
name = "approx-chol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Approximate Cholesky factorization for graph Laplacians"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["laplacian", "sparse", "cholesky", "preconditioner", "sddm"]
categories.workspace = true
# A nested workspace nothing in the published crate reads.
exclude = ["fuzz"]

[lints]
workspace = true

[dependencies]
rand = { version = "0.10.0"}
serde = { version = "1", features = ["derive"], optional = true }
sprs = { version = "0.11", optional = true, default-features = false }
faer = { version = "0.24", optional = true, default-features = false }
num-traits = "0.2"

[features]
default = []
serde = ["dep:serde"]
sprs = ["dep:sprs"]
faer = ["dep:faer"]

[dev-dependencies]
stats_alloc = "=0.1.10"
allocation-counter = "=0.8.1"
# Keep the full development suite compatible with the declared Rust 1.85 MSRV.
criterion = { version = "=0.7.0", features = ["html_reports"] }
proptest = "1.6"
rstest = { version = "0.26.1", default-features = false }
serde_json = "1"

[[bench]]
name = "backend"
harness = false

[[bench]]
name = "factorization"
harness = false

[[bench]]
name = "sampling"
harness = false

[[bench]]
name = "smoke"
harness = false

[[bench]]
name = "solve"
harness = false

[[bench]]
name = "wallclock_banded"
harness = false


[[test]]
name = "scratch_allocations"
harness = false

[[test]]
name = "construction_allocations"
harness = false
